server:
  port: 8080

spring:
  application:
    name: gridweaver-backend
  threads:
    virtual:
      enabled: true          # Spring Boot 3.2+: use virtual threads for @Async / MVC request handling
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-offset-reset: latest

gridweaver:
  simulation:
    node-count:  500       # set lower (e.g. 500) for local dev on modest hardware
    tick-ms: 2000             # how often each simulated node reports telemetry

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,threaddump

logging:
  level:
    com.gridweaver: INFO
    org.springframework.statemachine: WARN
